name: 🧪 Deploy to Staging

on:
  push:
    branches:
      - staging

jobs:
  deploy-staging:
    name: SSH Deploy to Staging (staging.maisonmerch.ca)
    runs-on: ubuntu-latest

    steps:
      - name: Deploy via SSH — server pulls latest theme from GitHub
        uses: appleboy/ssh-action@v1.0.3
        with:
          host:     ${{ secrets.SSH_HOST }}
          username: ${{ secrets.SSH_USERNAME }}
          key:      ${{ secrets.SSH_PRIVATE_KEY }}
          port:     22
          script: |
            set -e

            REPO_DIR="$HOME/maisonmerch-website"
            THEME_SRC="$REPO_DIR/theme/twentytwentyfive"

            echo "=== Step 1: Locating staging WordPress directory ==="
            ls "$HOME/public_html/" || echo "public_html not found"
            ls "$HOME/public_html/staging.maisonmerch.ca/" 2>/dev/null || echo "staging.maisonmerch.ca dir not found"
            ls "$HOME/public_html/staging.maisonmerch.ca/wp-content/themes/" 2>/dev/null || echo "themes dir not found"

            echo "=== Step 2: Finding actual staging document root ==="
            find "$HOME" -maxdepth 3 -name "wp-config.php" 2>/dev/null || echo "No wp-config.php found"

            echo "=== Step 3: Updating repo ==="
            if [ -d "$REPO_DIR/.git" ]; then
              cd "$REPO_DIR"
              git fetch origin
              git checkout staging
              git pull origin staging
              echo "Latest commit: $(git log --oneline -1)"
            else
              git clone https://${{ secrets.GH_PAT }}@github.com/iyanuakanji/maisonmerch-website.git "$REPO_DIR"
              cd "$REPO_DIR"
              git checkout staging
            fi

            echo "=== Step 4: Theme source files ==="
            ls "$THEME_SRC/" | head -20

            echo "=== Step 5: Copying files ==="
            THEME_DEST="$HOME/public_html/staging.maisonmerch.ca/wp-content/themes/twentytwentyfive"
            mkdir -p "$THEME_DEST"
            cp -rv "$THEME_SRC/." "$THEME_DEST/"

            echo "=== Step 6: Verify destination ==="
            ls "$THEME_DEST/" | head -20

            echo "✅ Deploy complete — staging.maisonmerch.ca updated"
