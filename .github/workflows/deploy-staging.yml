name: 🧪 Deploy to Staging

on:
  push:
    branches:
      - staging

jobs:
  deploy-staging:
    name: SSH Deploy to Staging (staging.maisonmerch.ca)
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Deploy theme files via SCP
        uses: appleboy/scp-action@v0.1.7
        with:
          host:     ${{ secrets.SSH_HOST }}
          username: ${{ secrets.SSH_USERNAME }}
          key:      ${{ secrets.SSH_PRIVATE_KEY }}
          port:     22
          source:   "theme/"
          target:   ${{ secrets.SSH_STAGING_PATH }}
          strip_components: 1

      - name: Notify on success
        if: success()
        run: echo "✅ Staging deploy complete — preview at https://staging.maisonmerch.ca"

      - name: Notify on failure
        if: failure()
        run: |
          echo "❌ Staging deploy failed — check SSH/SCP logs above"
          exit 1
