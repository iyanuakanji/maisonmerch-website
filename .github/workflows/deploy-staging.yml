name: 🧪 Deploy to Staging

on:
  push:
    branches:
      - staging

jobs:
  deploy-staging:
    name: Deploy to Staging (staging.maisonmerch.ca)
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup SSH key
        run: |
          mkdir -p ~/.ssh
          echo "${{ secrets.SSH_PRIVATE_KEY }}" > ~/.ssh/id_ed25519
          chmod 600 ~/.ssh/id_ed25519
          ssh-keyscan -p 22 -H ${{ secrets.SSH_HOST }} >> ~/.ssh/known_hosts 2>/dev/null
          echo "SSH ready"

      - name: Verify theme files on runner
        run: |
          echo "style.min.css: $(wc -c < theme/twentytwentyfive/style.min.css) bytes"
          echo "functions.php: $(wc -c < theme/twentytwentyfive/functions.php) bytes"
          echo "maison-merch.css: $(wc -c < theme/twentytwentyfive/assets/css/maison-merch.css) bytes"

      - name: Deploy via tar pipe over SSH
        env:
          SSH_HOST: ${{ secrets.SSH_HOST }}
          SSH_USER: ${{ secrets.SSH_USERNAME }}
          DEST: /home/ot1zddd6prqc/public_html/staging.maisonmerch.ca/wp-content/themes/twentytwentyfive
        run: |
          tar czf - -C theme/twentytwentyfive . | \
          ssh -i ~/.ssh/id_ed25519 \
              -o StrictHostKeyChecking=no \
              -o BatchMode=yes \
              $SSH_USER@$SSH_HOST \
              "mkdir -p $DEST && cd $DEST && tar xzf -"

      - name: Verify files on server
        env:
          SSH_HOST: ${{ secrets.SSH_HOST }}
          SSH_USER: ${{ secrets.SSH_USERNAME }}
          DEST: /home/ot1zddd6prqc/public_html/staging.maisonmerch.ca/wp-content/themes/twentytwentyfive
        run: |
          ssh -i ~/.ssh/id_ed25519 \
              -o StrictHostKeyChecking=no \
              -o BatchMode=yes \
              $SSH_USER@$SSH_HOST \
              "echo 'style.min.css: '\$(wc -c < $DEST/style.min.css)' bytes' && echo 'functions.php: '\$(wc -c < $DEST/functions.php)' bytes'"

      - name: Notify on success
        if: success()
        run: echo "✅ Staging deploy complete — staging.maisonmerch.ca updated"

      - name: Notify on failure
        if: failure()
        run: echo "❌ Deploy failed — check logs above"
