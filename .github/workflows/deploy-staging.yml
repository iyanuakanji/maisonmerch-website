name: 🧪 Deploy to Staging

on:
  push:
    branches:
      - staging

jobs:
  deploy-staging:
    name: SSH Deploy to Staging (staging.maisonmerch.ca)
    runs-on: ubuntu-latest

    steps:
      - name: Deploy via SSH — server pulls latest theme from GitHub
        uses: appleboy/ssh-action@v1.0.3
        with:
          host:     ${{ secrets.SSH_HOST }}
          username: ${{ secrets.SSH_USERNAME }}
          key:      ${{ secrets.SSH_PRIVATE_KEY }}
          port:     22
          script: |
            set -e

            REPO_DIR="$HOME/maisonmerch-website"
            THEME_SRC="$REPO_DIR/theme/twentytwentyfive"
            THEME_DEST="$HOME/public_html/staging.maisonmerch.ca/wp-content/themes/twentytwentyfive"

            echo "=== Updating repo with fresh PAT ==="
            if [ -d "$REPO_DIR/.git" ]; then
              cd "$REPO_DIR"
              git remote set-url origin https://${{ secrets.GH_PAT }}@github.com/iyanuakanji/maisonmerch-website.git
              git fetch origin
              git checkout staging
              git reset --hard origin/staging
            else
              git clone https://${{ secrets.GH_PAT }}@github.com/iyanuakanji/maisonmerch-website.git "$REPO_DIR"
              cd "$REPO_DIR"
              git checkout staging
            fi
            echo "Server is now at commit: $(git log --oneline -1)"

            echo "=== Verifying source files ==="
            echo "style.min.css size: $(wc -c < $THEME_SRC/style.min.css) bytes"
            echo "functions.php size: $(wc -c < $THEME_SRC/functions.php) bytes"

            echo "=== Copying theme files to WordPress ==="
            mkdir -p "$THEME_DEST"
            cp -rf "$THEME_SRC/." "$THEME_DEST/"

            echo "=== Verifying destination ==="
            echo "style.min.css on server: $(wc -c < $THEME_DEST/style.min.css) bytes"
            echo "functions.php on server: $(wc -c < $THEME_DEST/functions.php) bytes"

            echo "✅ Deploy complete — staging.maisonmerch.ca updated"
