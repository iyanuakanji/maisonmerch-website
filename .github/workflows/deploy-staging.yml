name: 🧪 Deploy to Staging

on:
  push:
    branches:
      - staging

jobs:
  deploy-staging:
    name: SSH Deploy to Staging (staging.maisonmerch.ca)
    runs-on: ubuntu-latest
    permissions:
      contents: read

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup SSH key
        run: |
          mkdir -p ~/.ssh
          echo "${{ secrets.SSH_PRIVATE_KEY }}" > ~/.ssh/id_ed25519
          chmod 600 ~/.ssh/id_ed25519
          ssh-keyscan -p 22 ${{ secrets.SSH_HOST }} >> ~/.ssh/known_hosts 2>/dev/null

      - name: Deploy theme files via rsync
        run: |
          rsync -avz --delete \
            -e "ssh -i ~/.ssh/id_ed25519 -o StrictHostKeyChecking=no" \
            ./theme/twentytwentyfive/ \
            ${{ secrets.SSH_USERNAME }}@${{ secrets.SSH_HOST }}:${{ secrets.SSH_STAGING_PATH }}

      - name: Notify on success
        if: success()
        run: echo "✅ Staging deploy complete — preview at https://staging.maisonmerch.ca"

      - name: Notify on failure
        if: failure()
        run: |
          echo "❌ Staging deploy failed — check rsync logs above"
          exit 1
