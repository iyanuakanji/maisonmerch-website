name: 🧪 Deploy to Staging

on:
  push:
    branches:
      - staging

jobs:
  deploy-staging:
    name: Deploy to Staging (staging.maisonmerch.ca)
    runs-on: ubuntu-latest

    steps:
      - name: Deploy via SSH
        uses: appleboy/ssh-action@v1.0.3
        with:
          host:     ${{ secrets.SSH_HOST }}
          username: ${{ secrets.SSH_USERNAME }}
          key:      ${{ secrets.SSH_PRIVATE_KEY }}
          port:     22
          script: |
            set -e

            THEME_DEST="$HOME/public_html/staging.maisonmerch.ca/wp-content/themes/twentytwentyfive"
            CLONE_DIR="$HOME/maisonmerch-deploy-tmp"

            echo "=== Fresh clone of staging branch ==="
            rm -rf "$CLONE_DIR"
            git clone --depth 1 --branch staging \
              https://${{ secrets.GH_PAT }}@github.com/iyanuakanji/maisonmerch-website.git \
              "$CLONE_DIR"

            echo "=== Cloned commit ==="
            git -C "$CLONE_DIR" log --oneline -1

            echo "=== Source file sizes ==="
            echo "style.min.css: $(wc -c < $CLONE_DIR/theme/twentytwentyfive/style.min.css) bytes"
            echo "functions.php: $(wc -c < $CLONE_DIR/theme/twentytwentyfive/functions.php) bytes"

            echo "=== Copying to WordPress theme directory ==="
            mkdir -p "$THEME_DEST"
            cp -rf "$CLONE_DIR/theme/twentytwentyfive/." "$THEME_DEST/"

            echo "=== Destination file sizes after copy ==="
            echo "style.min.css: $(wc -c < $THEME_DEST/style.min.css) bytes"
            echo "functions.php: $(wc -c < $THEME_DEST/functions.php) bytes"

            echo "=== Cleanup ==="
            rm -rf "$CLONE_DIR"

            echo "✅ Deploy complete — staging.maisonmerch.ca updated"
