name: 📥 Sync Theme from Staging (Run Once)

on:
  workflow_dispatch:
    inputs:
      confirm:
        description: 'Type "yes" to pull the staging theme into this repo'
        required: true
        default: 'no'

jobs:
  sync:
    name: Pull staging theme from GoDaddy via SSH
    runs-on: ubuntu-latest
    if: github.event.inputs.confirm == 'yes'

    steps:
      - name: Copy theme files from server to repo via SSH
        uses: appleboy/ssh-action@v1.0.3
        with:
          host:     ${{ secrets.SSH_HOST }}
          username: ${{ secrets.SSH_USERNAME }}
          password: ${{ secrets.SSH_PASSWORD }}
          port:     22
          script: |
            cd ~

            # Clone repo if not already there, otherwise update it
            if [ -d "maisonmerch-website/.git" ]; then
              echo "Repo exists — pulling latest..."
              cd maisonmerch-website
              git fetch origin
              git checkout staging
              git pull origin staging
            else
              echo "Cloning repo..."
              git clone https://${{ secrets.GH_PAT }}@github.com/iyanuakanji/maisonmerch-website.git
              cd maisonmerch-website
              git checkout staging
            fi

            # Copy live theme files into the repo
            echo "Copying theme files..."
            cp -r ~/public_html/staging.maisonmerch.ca/wp-content/themes/twentytwentyfive/. ~/maisonmerch-website/theme/

            # Commit and push to staging branch
            git config user.name  "github-actions[bot]"
            git config user.email "github-actions[bot]@users.noreply.github.com"
            git add theme/
            git diff --cached --quiet && echo "No changes to commit" || (
              git commit -m "chore: sync twentytwentyfive theme from staging server [$(date '+%Y-%m-%d')]" &&
              git push origin staging &&
              echo "✅ Theme synced and pushed to staging branch"
            )
