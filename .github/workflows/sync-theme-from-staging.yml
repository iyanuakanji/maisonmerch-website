name: 📥 Sync Theme from Staging (Run Once)

on:
  workflow_dispatch:
    inputs:
      confirm:
        description: 'Type "yes" to pull the staging theme into this repo'
        required: true
        default: 'no'

jobs:
  sync:
    name: Pull staging theme from GoDaddy via SSH
    runs-on: ubuntu-latest
    if: github.event.inputs.confirm == 'yes'

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          ref: staging

      - name: Setup SSH key
        run: |
          mkdir -p ~/.ssh
          echo "${{ secrets.SSH_PRIVATE_KEY }}" > ~/.ssh/id_ed25519
          chmod 600 ~/.ssh/id_ed25519
          ssh-keyscan -p 22 ${{ secrets.SSH_HOST }} >> ~/.ssh/known_hosts

      - name: List server directories
        run: |
          ssh -i ~/.ssh/id_ed25519 ${{ secrets.SSH_USERNAME }}@${{ secrets.SSH_HOST }} "
            echo '=== Home directory ==='
            ls ~/
            echo '=== public_html ==='
            ls ~/public_html/ 2>/dev/null || echo 'public_html not found'
            echo '=== Staging root ==='
            ls ~/public_html/staging.maisonmerch.ca/ 2>/dev/null || echo 'staging.maisonmerch.ca not found'
            echo '=== Themes ==='
            ls ~/public_html/staging.maisonmerch.ca/wp-content/themes/ 2>/dev/null || echo 'themes not found'
          "

      - name: Pull theme files from server
        run: |
          scp -r -i ~/.ssh/id_ed25519 \
            ${{ secrets.SSH_USERNAME }}@${{ secrets.SSH_HOST }}:~/public_html/staging.maisonmerch.ca/wp-content/themes/twentytwentyfive/ \
            ./theme/
          echo "Files pulled: $(find theme/ -type f | wc -l)"

      - name: Commit and push to staging branch
        env:
          GH_PAT: ${{ secrets.GH_PAT }}
        run: |
          git config user.name  "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git remote set-url origin https://x-access-token:${GH_PAT}@github.com/${{ github.repository }}.git
          git add theme/
          git diff --cached --quiet && echo "No changes to commit" || (
            git commit -m "chore: sync twentytwentyfive theme from staging server [$(date '+%Y-%m-%d')]" &&
            git push origin staging &&
            echo "✅ Theme synced and pushed to staging branch"
          )
