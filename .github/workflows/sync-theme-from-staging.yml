name: 📥 Sync Theme from Staging (Run Once)

on:
  workflow_dispatch:
    inputs:
      confirm:
        description: 'Type "yes" to pull the staging theme into this repo'
        required: true
        default: 'no'

jobs:
  sync:
    name: Pull staging theme from GoDaddy via FTP
    runs-on: ubuntu-latest
    if: github.event.inputs.confirm == 'yes'

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          token: ${{ github.token }}
          ref: staging

      - name: Install lftp
        run: sudo apt-get install -y lftp

      - name: Download theme from GoDaddy Staging
        env:
          FTP_SERVER:   ${{ secrets.FTP_SERVER }}
          FTP_PORT:     ${{ secrets.FTP_PORT }}
          FTP_USER:     ${{ secrets.FTP_USERNAME }}
          FTP_PASS:     ${{ secrets.FTP_PASSWORD }}
          THEME_PATH:   ${{ secrets.FTP_STAGING_THEME_PATH }}
        run: |
          echo "🔍 Testing DNS resolution..."
          nslookup $FTP_SERVER || echo "DNS lookup failed — check FTP_SERVER secret value"
          mkdir -p theme
          lftp -u "$FTP_USER","$FTP_PASS" ftp://$FTP_SERVER:$FTP_PORT << 'FTPEOF'
          set ssl:verify-certificate no
          set ftp:passive-mode true
          set net:timeout 30
          set net:max-retries 3
          mirror --parallel=4 "$THEME_PATH" ./theme/
          bye
          FTPEOF
          echo "Staging theme downloaded. Files:"
          find theme/ -type f | head -30

      - name: Commit and push theme files to staging branch
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: |
          git config user.name  "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git remote set-url origin https://x-access-token:${GITHUB_TOKEN}@github.com/${{ github.repository }}.git
          git add theme/
          git diff --cached --quiet || git commit -m "chore: sync theme from GoDaddy staging [$(date '+%Y-%m-%d')]"
          git push origin staging
